services:
  db:
  #https://hub.docker.com/_/postgres?_gl=1*mvnlqo*_gcl_au*MTA5NDY5MDU4MS4xNzE5MDYyNTE0*_ga*MTk2MDc3NjkzMS4xNzE5MDYyNTE1*_ga_XJWPQMJYHQ*MTcxOTE0NDAyNC42LjEuMTcxOTE0NDc2Ny42MC4wLjA. 
    container_name: ${DB_HOST}
    image: 'postgres:latest'
    # set shared memory limit when using docker-compose
    #shm_size: 128mb
    environment:
      PGDATA: '/var/lib/postgresql/data/pgdata'
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - './pgdata:/var/lib/postgresql/data/pgdata'
    networks:
      dbnet:
        ipv4_address: ${DB_ADDR}
    ports:
      - ${DB_PORT}:5432 #required for access via localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: always
  
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:7
    profiles:
      - pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    networks:
      mynet:
        ipv4_address: 172.22.0.25 #PGADMIN_LISTEN_PORT Default: 80 or 443
      dbnet:
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always

  api:
    container_name: ${BACKEND_HOST}
    # relative path interpreted as relative to the location of the Compose file.
    # https://docs.docker.com/compose/compose-file/build/
    build:
      context: ./depo23_srv
      dockerfile: Dockerfile_mvn   
    # https://docs.docker.com/compose/profiles/ 
    # Command line: 'docker compose --prifile api up -d'
    profiles:
      - api  
    environment:
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    networks:
      mynet:
        ipv4_address: 172.22.0.22
      dbnet:
        ipv4_address: 172.23.0.5
    depends_on:
      db:
        condition: service_healthy
    restart: always
  
  cli:
    container_name: depo_vue
    build:
      context: ./depo23_vue
      dockerfile: Dockerfile_vue
    profiles:
      - cli
    networks:
      mynet:
        ipv4_address: 172.22.0.23
    ports:
      - 80:80
    restart: always

volumes:
  pg_data:
  pgadmin_data:

networks:
  dbnet:
    driver: bridge
    ipam:
      config:
      - subnet: 172.23.0.0/24
        gateway: 172.23.0.1
  mynet:
    name: vps_mynet
    external: true

